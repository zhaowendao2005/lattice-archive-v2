name: Build iOS IPA (Manual)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build & Sign IPA
    runs-on: macos-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 编译前端静态资源
        run: pnpm run build

      - name: 同步 Capacitor iOS 原生工程
        run: npx cap sync ios

      # ===== 导入证书与描述文件 =====
      - name: 导入 Apple 证书与 Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PATH: ${{ runner.temp }}/build_certificate.p12
          PP_PATH: ${{ runner.temp }}/build_pp.mobileprovision
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          # 1. 使用 Node.js 精确还原 Base64 二进制文件 (避免 macOS BSD base64 命令行差异)
          node -e '
            const fs = require("fs");
            const cert = Buffer.from(process.env.BUILD_CERTIFICATE_BASE64.trim(), "base64");
            const pp = Buffer.from(process.env.BUILD_PROVISION_PROFILE_BASE64.trim(), "base64");
            fs.writeFileSync(process.env.CERTIFICATE_PATH, cert);
            fs.writeFileSync(process.env.PP_PATH, pp);
            console.log("✅ 解密完成: 证书大小", cert.length, "字节; 描述文件大小", pp.length, "字节");
          '

          # 2. 创建独立钥匙串并解锁
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. 导入 PKCS12 证书与私钥 (不限制 -t cert 避免聚合包解析异常)
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          # 验证并输出可用签名证书身份
          echo "🔍 钥匙串有效证书检测:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # 4. 安装 Provisioning Profile (提取 UUID 确保 Xcode 能精准识别)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -a -A 1 "UUID" $PP_PATH | grep -o "[-a-zA-Z0-9]\{36\}" | head -n 1)
          echo "✅ 描述文件 UUID: $UUID"
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "✅ 证书与描述文件配置就绪"

      # ===== Xcode Archive =====
      - name: 执行 xcodebuild Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration ${{ inputs.configuration }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates

      # ===== 导出 IPA =====
      - name: 导出 IPA 安装包
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath output \
            -allowProvisioningUpdates

      # ===== 安全清理 =====
      - name: 清理钥匙串与敏感凭证
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision

      # ===== 上传构建产物 =====
      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: lattice-archive-ipa
          path: output/*.ipa
          retention-days: 7
